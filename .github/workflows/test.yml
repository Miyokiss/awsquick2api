name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check quickpool tests
      - run: node --check quickpool/static/app.js
      - run: node tests/test_admin_session.cjs
      - run: node tests/test_key_visibility.cjs
      - name: Windows startup with restricted PowerShell and a fresh venv
        if: runner.os == 'Windows'
        run: python tests/windows_startup_smoke.py
